<!doctype html><html lang="en"><meta charset="utf-8"><title>Isolated silk reveal verification</title>
<style>body{font:18px Arial;margin:32px;color:#002351}button{padding:12px;margin:8px}main{max-width:960px}header,li{padding:24px;border:1px solid #d9e4ee;list-style:none;margin:12px;background:#ebf2f7}.spacer{height:110vh}pre{white-space:pre-wrap;position:fixed;right:20px;top:90px;width:320px;max-height:700px;overflow:auto;font-size:12px;background:white;z-index:3}nav{position:sticky;top:0;background:white;z-index:2}</style>
<nav><button id="normal">Restart normal motion</button><button id="reduce">Enable reduced motion</button><button id="add">Add dynamic card</button><button id="focus">Focus animated control</button><a href="#later">Scroll to next scene</a></nav>
<p>This isolated local fixture uses the actual production reveal controller. Its simulated preference applies only to this document.</p><pre id="results">Starting</pre>
<main><header class="section-header"><h1>From brief to delivery</h1><a href="#later">Explore</a></header><ol class="stage-grid"><li>Brief and reference</li><li>Sample and approval</li><li>Quality and delivery</li></ol><div class="spacer"></div><header id="later" class="section-header"><h2>Your next scene</h2></header></main>
<script type="module">
// Animate existing content without changing its server-rendered structure.
// Nothing is hidden before hydration or when browser animation APIs are absent.
const revealTargets = [
    ".hero-ribbon",
    ".hero-columns > *",
    ".section-header",
    ".why-copy > *",
    ".home-facts > div",
    ".home-reason-grid > article",
    ".home-quality-grid > article",
    ".showcase-grid > a",
    ".showcase-children",
    ".stage-grid > li",
    ".capability-card",
    ".project-card",
    ".article-card",
    ".photo",
    ".metrics > div",
    ".cta-grid > div > h2",
    ".cta-grid > div > p",
    ".cta-grid > div > .button-row",
    ".contact-block",
].join(",");
export function attachSilkMotion(surface) {
    if (!surface || !window.IntersectionObserver || !Element.prototype.animate)
        return;
    const preference = window.matchMedia("(prefers-reduced-motion: reduce)");
    const animations = new Map();
    const observed = new Set();
    let reveals;
    let additions;
    const settle = (element) => {
        animations.get(element)?.cancel();
        animations.delete(element);
        element.dataset.silkReveal = "settled";
    };
    const reveal = (element) => {
        reveals?.unobserve(element);
        // A focused control must be usable immediately, even during a reveal.
        if (element.contains(document.activeElement))
            return settle(element);
        const siblings = element.parentElement?.children;
        const index = siblings ? Array.from(siblings).indexOf(element) : 0;
        const animation = element.animate([
            { opacity: 0, transform: "translate3d(0, 20px, 0)" },
            { opacity: 1, transform: "translate3d(0, 0, 0)" },
        ], {
            duration: 720,
            delay: Math.min(index, 3) * 65,
            easing: "cubic-bezier(0.22, 1, 0.36, 1)",
            fill: "backwards",
        });
        element.dataset.silkReveal = "entering";
        animations.set(element, animation);
        animation.onfinish = () => settle(element);
    };
    const stop = () => {
        reveals?.disconnect();
        additions?.disconnect();
        animations.forEach((_, element) => settle(element));
    };
    const start = () => {
        stop();
        if (preference.matches)
            return;
        reveals = new IntersectionObserver((entries) => {
            for (const entry of entries)
                if (entry.isIntersecting)
                    reveal(entry.target);
        }, { rootMargin: "0px 0px -24px 0px", threshold: 0 });
        const scan = () => {
            surface
                .querySelectorAll(revealTargets)
                .forEach((element) => {
                // Keep each card atomic; nested photos should not move twice.
                if (observed.has(element) ||
                    element.parentElement?.closest(revealTargets))
                    return;
                observed.add(element);
                const bounds = element.getBoundingClientRect();
                if (bounds.bottom <= 0 || element.contains(document.activeElement))
                    return settle(element);
                if (bounds.top < window.innerHeight - 24) {
                    if (window.scrollY < 8)
                        reveal(element);
                    else
                        settle(element);
                }
                else
                    reveals?.observe(element);
            });
        };
        observed.clear();
        scan();
        // Query filters and client navigation can replace cards without a new path.
        additions = new MutationObserver(scan);
        additions.observe(surface, { childList: true, subtree: true });
    };
    const onInteract = (event) => {
        if (!(event.target instanceof Element))
            return;
        const element = event.target.closest("[data-silk-reveal]");
        if (element)
            settle(element);
    };
    start();
    preference.addEventListener("change", start);
    surface.addEventListener("focusin", onInteract);
    surface.addEventListener("pointerover", onInteract);
    return () => {
        stop();
        preference.removeEventListener("change", start);
        surface.removeEventListener("focusin", onInteract);
        surface.removeEventListener("pointerover", onInteract);
        observed.forEach((element) => delete element.dataset.silkReveal);
    };
}

const nativeMatchMedia = window.matchMedia.bind(window);
const preference = new EventTarget(); preference.matches = false;
window.matchMedia = (query) => query === '(prefers-reduced-motion: reduce)' ? preference : nativeMatchMedia(query);
const surface = document.querySelector('main');
let cleanup = attachSilkMotion(surface);
const evidence = [];
const report = (name) => {
  evidence.push({name,reduced:preference.matches,active:surface.getAnimations({subtree:true}).length,states:Array.from(surface.querySelectorAll('[data-silk-reveal]')).map(e=>e.dataset.silkReveal),opacity:Array.from(surface.querySelectorAll('.stage-grid li')).map(e=>getComputedStyle(e).opacity)});
  document.querySelector('#results').textContent = JSON.stringify(evidence,null,2);
};
report('normal-motion-start');
setTimeout(()=>report('normal-motion-settled'),1100);
document.querySelector('#normal').onclick = () => {cleanup?.();preference.matches=false;cleanup=attachSilkMotion(surface);report('restart');setTimeout(()=>report('restart-settled'),1100)};
document.querySelector('#reduce').onclick = () => {preference.matches=true;preference.dispatchEvent(new Event('change'));report('reduced-motion-cancelled')};
document.querySelector('#add').onclick = () => {const card=document.createElement('li');card.textContent='Dynamically added product';surface.querySelector('ol').append(card);setTimeout(()=>report('dynamic-card'),80)};
document.querySelector('#focus').onclick = () => {surface.querySelector('header a').focus();report('focused-control-settled')};
</script></html>
